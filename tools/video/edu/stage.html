<!doctype html><html><head><meta charset="utf-8"><style>

const E=(par,tag,css,html)=>{const e=document.createElement(tag);e.style.cssText=css||'';if(html!=null)e.innerHTML=html;par.appendChild(e);return e};

 this.f=E(r,'div',`position:absolute;left:1230px;top:260px;width:630px;background:${CARD};color:${INK};border-radius:30px;padding:40px;text-align:center`,`<div style="font-size:34px;font-weight:800">Cash-on-cash return</div><div style="font-size:42px;font-weight:700;margin:20px 0">$3,624 ÷ $118,000</div><div style="font-size:120px;font-weight:900;color:${GREEN}">3.07%</div><div style="font-size:28px;color:#555;margin-top:6px">yearly cash flow ÷ cash you put in</div>`)},

 const ch=chunks(cfg.text.replace('octo pie sees labs dot com slash rental calc','octopisceslabs.com/rental-calc').replace('Equity Foundry','EquityFoundry').replace(/cash on cash/g,'cash-on-cash').replace(/Air B N B/g,'Airbnb')),tw=ch.reduce((a,c)=>a+c.split(' ').length,0);let a=0.2,txt='';const span=Math.max(cfg.voice,0.5);for(const c of ch){const d=span*c.split(' ').length/tw;if(t>=a&&t<a+d){txt=c}a+=d}
